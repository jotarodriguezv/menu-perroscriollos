<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Perros Criollos — Menú Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FF0000;
      --secondary: #FFD700;
      --accent-purple: #9D00FF;
      --accent-green: #00FF00;
      --dark: #0a0a0a;
      --surface: #1a1a1a;
      --card: #252525;
      --border: #333333;
      --text: #ffffff;
      --text-muted: #b0b0b0;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--dark);
      background-image: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.85);
      z-index: -1;
      pointer-events: none;
    }

    .header, .nav-sticky, .main, .footer {
      position: relative;
      z-index: 1;
    }

    /* ── HEADER ── */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: var(--surface);
      border-bottom: 3px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
    }

    .menu-toggle {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 24px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px;
      transition: transform 0.2s;
    }

    .menu-toggle:active { transform: scale(0.95); }

    .menu-toggle span {
      display: block;
      width: 24px;
      height: 3px;
      background: var(--primary);
      border-radius: 2px;
      box-shadow: 0 0 5px var(--primary);
    }

    .logo-header {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--primary);
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--primary), 0 0 20px rgba(255, 0, 0, 0.6);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ── CARRITO BOTÓN ── */
    .cart-btn {
      position: relative;
      background: none;
      border: 2px solid var(--primary);
      color: var(--primary);
      width: 44px;
      height: 44px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.2s;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
    }

    .cart-btn:hover {
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
      transform: scale(1.05);
    }

    .cart-btn:active { transform: scale(0.95); }

    .cart-count {
      position: absolute;
      top: -8px;
      right: -8px;
      background: var(--primary);
      color: var(--secondary);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 0 8px var(--primary);
    }

    /* ── SIDEBAR MENU ── */
    .sidebar {
      position: fixed;
      left: -100%;
      top: 0;
      width: 75%;
      max-width: 300px;
      height: 100vh;
      background: rgba(10, 10, 10, 0.98);
      backdrop-filter: blur(10px);
      border-right: 3px solid var(--primary);
      z-index: 200;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
      padding-top: 60px;
    }

    .sidebar.open { left: 0; }

    .sidebar-header {
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      color: var(--primary);
      text-transform: uppercase;
      text-shadow: 0 0 8px var(--primary);
    }

    .close-menu {
      background: none;
      border: none;
      color: var(--text);
      font-size: 28px;
      cursor: pointer;
    }

    .sidebar-nav { display: flex; flex-direction: column; }

    .sidebar-link {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      text-transform: uppercase;
      cursor: pointer;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      transition: all 0.2s;
    }

    .sidebar-link:hover,
    .sidebar-link:active,
    .sidebar-link.active {
      background: rgba(255, 0, 0, 0.15);
      color: var(--primary);
      border-left: 4px solid var(--primary);
      padding-left: 16px;
      text-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
    }

    /* ── OVERLAY ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }

    /* ── MAIN CONTENT ── */
    .main {
      margin-top: 60px;
      padding: 20px 12px 80px;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    .hero { text-align: center; margin-bottom: 30px; padding: 20px 0; }
    .hero-logo { width: 120px; height: 120px; margin: 0 auto 16px; object-fit: contain; filter: drop-shadow(0 0 10px var(--primary)); }
    .hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 42px;
      letter-spacing: 3px;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 0 15px var(--primary), 0 0 30px rgba(255, 0, 0, 0.4);
    }
    .hero-subtitle { font-size: 12px; color: var(--secondary); letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }

    /* ── CATEGORÍA SECCIÓN ── */
    .category-section { margin-bottom: 40px; }
    .category-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .category-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      color: var(--primary);
      text-transform: uppercase;
      text-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
    }
    .category-line { flex: 1; height: 2px; background: linear-gradient(90deg, var(--primary) 0%, transparent 100%); box-shadow: 0 0 5px var(--primary); }

    /* ── GRID PRODUCTOS ── */
    .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 768px) { .products-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }

    /* ── CARD PRODUCTO ── */
    .product-card {
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 2px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .product-card:hover {
      border-color: var(--primary);
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.4);
      transform: translateY(-2px);
    }
    .product-card:active { transform: scale(0.97); border-color: var(--primary); box-shadow: 0 0 15px var(--primary); }

    .card-img-wrap { position: relative; width: 100%; aspect-ratio: 1 / 1; background: var(--surface); overflow: hidden; }
    .card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    .product-card:hover .card-img { transform: scale(1.05); }

    .card-body { padding: 12px; }
    .card-name { font-family: 'Bebas Neue', sans-serif; font-size: 14px; color: var(--text); margin-bottom: 4px; text-transform: uppercase; transition: color 0.2s; }
    .product-card:hover .card-name { color: var(--primary); text-shadow: 0 0 5px rgba(255, 0, 0, 0.4); }
    .card-price { font-size: 13px; font-weight: 700; color: var(--secondary); }

    /* ── BOTÓN AGREGAR ── */
    .card-add-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary);
      color: var(--secondary);
      border: none;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
    }

    .card-add-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px var(--primary);
    }

    .card-add-btn:active { transform: scale(0.95); }

    /* ── CARRITO SIDEBAR ── */
    .cart-sidebar {
      position: fixed;
      right: -100%;
      top: 0;
      width: 100%;
      max-width: 350px;
      height: 100vh;
      background: var(--surface);
      border-left: 3px solid var(--primary);
      z-index: 250;
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -0 0 20px rgba(255, 0, 0, 0.3);
    }

    .cart-sidebar.open { right: 0; }

    .cart-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-header h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      color: var(--primary);
    }

    .close-cart {
      background: none;
      border: none;
      color: var(--text);
      font-size: 24px;
      cursor: pointer;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .cart-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .cart-item-price {
      color: var(--secondary);
      font-size: 12px;
      font-weight: 700;
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cart-item-btn {
      background: var(--primary);
      color: var(--secondary);
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s;
    }

    .cart-item-btn:hover { transform: scale(1.1); }

    .cart-item-qty {
      width: 30px;
      text-align: center;
      color: var(--text);
      font-weight: 600;
    }

    .cart-item-remove {
      background: rgba(255, 0, 0, 0.2);
      color: var(--primary);
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .cart-item-remove:hover { background: rgba(255, 0, 0, 0.4); }

    .cart-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--text-muted);
      text-align: center;
    }

    .cart-footer {
      padding: 16px;
      border-top: 1px solid var(--border);
      background: var(--card);
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: 700;
    }

    .cart-total span { color: var(--text-muted); }
    .cart-total strong { color: var(--secondary); text-shadow: 0 0 8px rgba(255, 215, 0, 0.5); }

    .btn-checkout {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: var(--secondary);
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
    }

    .btn-checkout:hover { transform: scale(1.02); box-shadow: 0 0 20px var(--primary); }
    .btn-checkout:active { transform: scale(0.98); }

    /* ── MODAL CHECKOUT ── */
    .checkout-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 300;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .checkout-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .checkout-modal {
      width: 100%;
      max-width: 100%;
      background: var(--surface);
      border-top: 3px solid var(--primary);
      border-radius: 20px 20px 0 0;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }

    .checkout-overlay.open .checkout-modal {
      transform: translateY(0);
    }

    @media (min-width: 768px) {
      .checkout-overlay { align-items: center; }
      .checkout-modal {
        max-width: 500px;
        border-radius: 16px;
        transform: translateY(20px);
      }
      .checkout-overlay.open .checkout-modal { transform: translateY(0); }
    }

    .checkout-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .checkout-header h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      color: var(--primary);
    }

    .close-checkout {
      background: none;
      border: none;
      color: var(--text);
      font-size: 24px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: var(--text);
      font-size: 13px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.3);
    }

    .checkout-summary {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 12px;
    }

    .checkout-summary-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .checkout-summary-total {
      display: flex;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      color: var(--secondary);
      font-weight: 700;
    }

    .btn-send-order {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: var(--secondary);
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
    }

    .btn-send-order:hover { transform: scale(1.02); box-shadow: 0 0 20px var(--primary); }
    .btn-send-order:active { transform: scale(0.98); }

    .footer { text-align: center; padding: 30px; font-size: 11px; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: 40px; }
  </style>
</head>
<body>
  <!-- HEADER -->
  <div class="header">
    <button class="menu-toggle" id="menuToggle">
      <span></span><span></span><span></span>
    </button>
    <div class="logo-header">PERROS CRIOLLOS</div>
    <div class="header-right">
      <button class="cart-btn" id="cartBtn" onclick="toggleCart()">
        🛒
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </div>

  <!-- SIDEBAR MENU -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Menú</div>
      <button class="close-menu" id="closeMenu">✕</button>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </div>

  <div class="overlay" id="overlay"></div>

  <!-- CARRITO SIDEBAR -->
  <div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
      <h3>🛒 Tu Pedido</h3>
      <button class="close-cart" onclick="toggleCart()">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-empty" id="cartEmpty">
      <div style="font-size: 40px;">🛒</div>
      <p>Tu carrito está vacío</p>
      <span style="font-size: 12px;">¡Agrega algo delicioso!</span>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <strong id="cartTotal">$0</strong>
      </div>
      <button class="btn-checkout" id="checkoutBtn" onclick="openCheckout()" style="display:none;">
        Hacer Pedido
      </button>
    </div>
  </div>

  <!-- CHECKOUT MODAL -->
  <div class="checkout-overlay" id="checkoutOverlay">
    <div class="checkout-modal">
      <div class="checkout-header">
        <h3>Finalizar Pedido</h3>
        <button class="close-checkout" onclick="closeCheckout()">✕</button>
      </div>
      <form onsubmit="sendWhatsAppOrder(event)">
        <div class="form-group">
          <label>👤 Tu Nombre</label>
          <input type="text" id="clientName" placeholder="Ej: Juan Pérez" required>
        </div>
        <div class="form-group">
          <label>📍 Dirección de Entrega</label>
          <textarea id="clientAddress" rows="3" placeholder="Ej: Av. Principal, Edificio Los Pinos, Piso 2, Apt 4" required></textarea>
        </div>
        <div class="form-group">
          <label>💳 Método de Pago</label>
          <select id="paymentMethod" required>
            <option value="Efectivo">💵 Efectivo</option>
            <option value="Pago Móvil">📱 Pago Móvil</option>
            <option value="Transferencia">🏦 Transferencia</option>
            <option value="Tarjeta">💳 Tarjeta</option>
          </select>
        </div>
        <div class="checkout-summary" id="checkoutSummary"></div>
        <button type="submit" class="btn-send-order">
          📱 Enviar Pedido por WhatsApp
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main">
    <div class="hero">
      <img src="imgs/logo.jpg" alt="Perros Criollos" class="hero-logo">
      <div class="hero-title">PERROS CRIOLLOS</div>
      <div class="hero-subtitle">Perros Calientes • Hamburguesas • Salchipapas</div>
    </div>
    <div id="mainContent"></div>
  </div>

  <div class="footer">© 2026 PERROS CRIOLLOS · Todos los derechos reservados</div>

    <script>
    // ── SUPABASE CONFIG ──
    const SUPABASE_URL = 'https://tllpmdhkdlqoqpnqmuwn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_PqQsGWYjDAu8oq9ABB1hnQ_658qW8RB';
    const RESTAURANTE_SLUG = 'perroscriollos';

    // ── CONFIGURACIÓN DEL RESTAURANTE ──
    const WHATSAPP_NUMBER = '573043632573'; // Cambia por el número real del cliente
    const RESTAURANT_NAME = 'Perros Criollos';

    // ── ESTADO GLOBAL ──
    let restaurante   = null;
    let categorias    = [];
    let productos     = [];
    let cart          = [];

    // ── API SUPABASE ──
    async function sbFetch(tabla, params = '') {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?${params}`, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      });
      if (!res.ok) throw new Error(`Error ${res.status} en ${tabla}`);
      return res.json();
    }

    // ── INIT ──
    async function init() {
      try {
        // 1. Datos del restaurante
        const restData = await sbFetch('restaurantes', `slug=eq.${RESTAURANTE_SLUG}&select=*`);
        if (!restData.length) throw new Error('Restaurante no encontrado');
        restaurante = restData[0];

        // Verificar si está activo
        if (restaurante.activo === false) {
          document.getElementById('mainContent').innerHTML = `
            <div style="text-align:center;padding:80px 20px;">
              <div style="font-size:48px;margin-bottom:16px;">🔒</div>
              <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--primary);margin-bottom:8px;">Servicio no disponible</div>
              <div style="font-size:14px;color:var(--text-muted)">Este menú no está disponible en este momento.</div>
            </div>`;
          return;
        }

        // 2. Categorías ordenadas
        categorias = await sbFetch('categorias',
          `restaurante_id=eq.${restaurante.id}&select=*&order=orden.asc`
        );

        // 3. Productos disponibles
        productos = await sbFetch('productos',
          `restaurante_id=eq.${restaurante.id}&disponible=eq.true&select=*&order=precio_numerico.asc`
        );

        buildSidebar();
        buildMenu();
        loadCartFromStorage();
        initScrollEffects();

      } catch (e) {
        console.error('Error cargando menú:', e);
        document.getElementById('mainContent').innerHTML = `
          <p style="text-align:center;padding:40px;color:var(--text-muted)">
            No se pudo cargar el menú. Intenta de nuevo.
          </p>`;
      }
    }

    // ── CARRITO - STORAGE ──
    function saveCartToStorage() {
      localStorage.setItem(`${RESTAURANTE_SLUG}_cart`, JSON.stringify(cart));
    }

    function loadCartFromStorage() {
      const saved = localStorage.getItem(`${RESTAURANTE_SLUG}_cart`);
      if (saved) {
        cart = JSON.parse(saved);
        updateCartUI();
      }
    }

    // ── CARRITO - AGREGAR ──
    function addToCart(productId) {
      const product = productos.find(p => p.id === productId);
      if (!product) return;
      const existing = cart.find(item => item.id === productId);
      if (existing) {
        existing.cantidad++;
      } else {
        cart.push({
          id: product.id,
          name: product.nombre,
          price: product.precio_numerico,
          cantidad: 1
        });
      }
      saveCartToStorage();
      updateCartUI();
    }

    // ── CARRITO - ACTUALIZAR CANTIDAD ──
    function updateQuantity(productId, change) {
      const item = cart.find(p => p.id === productId);
      if (item) {
        item.cantidad += change;
        if (item.cantidad <= 0) {
          cart = cart.filter(p => p.id !== productId);
        }
        saveCartToStorage();
        updateCartUI();
      }
    }

    // ── CARRITO - ELIMINAR ──
    function removeFromCart(productId) {
      cart = cart.filter(p => p.id !== productId);
      saveCartToStorage();
      updateCartUI();
    }

    // ── CARRITO - ACTUALIZAR UI ──
    function updateCartUI() {
      const count = cart.reduce((sum, item) => sum + item.cantidad, 0);
      document.getElementById('cartCount').textContent = count;

      const cartItemsDiv = document.getElementById('cartItems');
      const cartEmptyDiv = document.getElementById('cartEmpty');
      const checkoutBtn  = document.getElementById('checkoutBtn');

      if (cart.length === 0) {
        cartItemsDiv.innerHTML = '';
        cartEmptyDiv.style.display = 'flex';
        checkoutBtn.style.display  = 'none';
      } else {
        cartEmptyDiv.style.display = 'none';
        checkoutBtn.style.display  = 'block';
        cartItemsDiv.innerHTML = '';
        cart.forEach(item => {
          const div = document.createElement('div');
          div.className = 'cart-item';
          div.innerHTML = `
            <div class="cart-item-info">
              <div class="cart-item-name">${item.name}</div>
              <div class="cart-item-price">$${(item.price * item.cantidad).toLocaleString('es-CO')}</div>
            </div>
            <div class="cart-item-controls">
              <button class="cart-item-btn">−</button>
              <div class="cart-item-qty">${item.cantidad}</div>
              <button class="cart-item-btn">+</button>
              <button class="cart-item-remove">✕</button>
            </div>
          `;
          div.querySelectorAll('.cart-item-btn')[0].onclick = () => updateQuantity(item.id, -1);
          div.querySelectorAll('.cart-item-btn')[1].onclick = () => updateQuantity(item.id, 1);
          div.querySelector('.cart-item-remove').onclick    = () => removeFromCart(item.id);
          cartItemsDiv.appendChild(div);
        });
      }

      const total = cart.reduce((sum, item) => sum + (item.price * item.cantidad), 0);
      document.getElementById('cartTotal').textContent = '$' + total.toLocaleString('es-CO');
    }

    // ── CARRITO - TOGGLE ──
    function toggleCart() {
      document.getElementById('cartSidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('open');
    }

    // ── CHECKOUT ──
    function openCheckout() {
      updateCheckoutSummary();
      document.getElementById('checkoutOverlay').classList.add('open');
      document.getElementById('cartSidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
    }

    function closeCheckout() {
      document.getElementById('checkoutOverlay').classList.remove('open');
    }

    function updateCheckoutSummary() {
      const summary = document.getElementById('checkoutSummary');
      const total   = cart.reduce((sum, i) => sum + i.price * i.cantidad, 0);
      summary.innerHTML = cart.map(item => `
        <div class="checkout-summary-item">
          <span>${item.name} x${item.cantidad}</span>
          <span>$${(item.price * item.cantidad).toLocaleString('es-CO')}</span>
        </div>
      `).join('') + `
        <div class="checkout-summary-total">
          <span>Total</span>
          <span>$${total.toLocaleString('es-CO')}</span>
        </div>`;
    }

    // ── WHATSAPP ORDER ──
    function sendWhatsAppOrder(event) {
      event.preventDefault();

      const name    = document.getElementById('clientName').value;
      const address = document.getElementById('clientAddress').value;
      const barrio  = document.getElementById('clientBarrio')?.value || '';
      const phone   = document.getElementById('clientPhone')?.value || '';
      const payment = document.getElementById('paymentMethod').value;
      const notas   = document.getElementById('clientNotas')?.value || '';

      let message = `🍟 *Pedido - ${RESTAURANT_NAME}*\n\n`;
      message += `👤 *Cliente:* ${name}\n`;
      if (phone)   message += `📞 *Teléfono:* ${phone}\n`;
      message += `📍 *Dirección:* ${address}\n`;
      if (barrio)  message += `🏘 *Barrio:* ${barrio}\n`;
      message += `💳 *Pago:* ${payment}\n`;
      if (notas)   message += `📝 *Notas:* ${notas}\n`;
      message += `\n🛒 *Pedido:*\n`;

      cart.forEach(item => {
        message += `• ${item.name} x${item.cantidad} = $${(item.price * item.cantidad).toLocaleString('es-CO')}\n`;
      });

      const total = cart.reduce((sum, i) => sum + i.price * i.cantidad, 0);
      message += `\n*TOTAL: $${total.toLocaleString('es-CO')}*`;

      const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');

      // Limpiar carrito
      cart = [];
      saveCartToStorage();
      updateCartUI();
      closeCheckout();
      document.getElementById('clientName').value    = '';
      document.getElementById('clientAddress').value = '';
    }

    // ── SIDEBAR MENÚ ──
    function buildSidebar() {
      const nav = document.getElementById('sidebarNav');
      nav.innerHTML = '';
      let first = true;
      categorias.forEach(cat => {
        const tieneProd = productos.some(p => p.categoria_id === cat.id);
        if (!tieneProd) return;
        const btn = document.createElement('button');
        btn.className = 'sidebar-link' + (first ? ' active' : '');
        btn.textContent = `${cat.emoji || ''} ${cat.nombre}`.trim();
        btn.onclick = () => {
          document.getElementById(`cat-${cat.id}`)?.scrollIntoView({ behavior: 'smooth' });
          document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('sidebar').classList.remove('open');
          document.getElementById('overlay').classList.remove('open');
        };
        nav.appendChild(btn);
        first = false;
      });
    }

    // ── CONSTRUIR MENÚ ──
    function buildMenu() {
      const main = document.getElementById('mainContent');
      main.innerHTML = '';

      categorias.forEach(cat => {
        const prods = productos.filter(p => p.categoria_id === cat.id);
        if (!prods.length) return;

        const section = document.createElement('div');
        section.className = 'category-section';
        section.id = `cat-${cat.id}`;

        const header = document.createElement('div');
        header.className = 'category-header';
        header.innerHTML = `
          <h2 class="category-title">${cat.emoji || ''} ${cat.nombre}</h2>
          <div class="category-line"></div>
        `;
        section.appendChild(header);

        const grid = document.createElement('div');
        grid.className = 'products-grid';

        prods.forEach(p => {
          const card = document.createElement('div');
          card.className = 'product-card';

          const imgHtml = p.imagen_url
            ? `<img src="${p.imagen_url}" alt="${p.nombre}" class="card-img">`
            : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#444;font-size:32px;">🌭</div>`;

          card.innerHTML = `
            <div class="card-img-wrap">
              ${imgHtml}
              <button class="card-add-btn">+</button>
            </div>
            <div class="card-body">
              <div class="card-name">${p.nombre}</div>
              <div class="card-price">$${p.precio_numerico.toLocaleString('es-CO')}</div>
            </div>
          `;
          card.querySelector('.card-add-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            addToCart(p.id);
          });
          grid.appendChild(card);
        });

        section.appendChild(grid);
        main.appendChild(section);
      });
    }

    // ── SCROLL EFFECTS ──
    function initScrollEffects() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const catId = entry.target.id.replace('cat-', '');
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
            const cat = categorias.find(c => c.id === catId);
            if (cat) {
              document.querySelectorAll('.sidebar-link').forEach(btn => {
                if (btn.textContent.trim().includes(cat.nombre)) btn.classList.add('active');
              });
            }
          }
        });
      }, { rootMargin: '-30% 0px -60% 0px' });

      document.querySelectorAll('.category-section').forEach(s => observer.observe(s));
    }

    // ── EVENTOS ──
    document.getElementById('menuToggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('open');
    });

    document.getElementById('closeMenu').addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
    });

    document.getElementById('overlay').addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('cartSidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
    });

    // ── ARRANCAR ──
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
